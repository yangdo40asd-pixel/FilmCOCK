name: filmcock_app
description: "영화 탐색, MBTI·장르 추천, 활동 기록과 영화 챗봇을 제공하는 Flutter 앱."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  http: ^1.2.2
  image_picker: ^1.1.2
  youtube_player_flutter: ^9.0.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: 6.1.5
  flutter_svg: ^2.3.0
  carousel_slider: ^5.1.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.6
  firebase_ai: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # 런타임 에셋의 기존 경로를 유지한다.
  assets:
    - assets/images/
    - assets/images/mbti/
    - assets/images/tier/
    - assets/data/chatbot_movies.json
    # 실제 api_keys.json은 로컬 전용이며 Git에서 제외된다.
    - config/
